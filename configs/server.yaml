schema_version: 1
project_id: conserved-manifold-regime
project_status: exploratory_non_preregistered
scientific_gates: false

# PUBLIC SYNTHETIC TEMPLATE ONLY. These values intentionally identify no real host,
# account, tunnel, accelerator, scheduler inventory, or university storage. Create a
# private server-only variant outside version control, resolve every value there, and
# select it with --server-config. The queue validates and hash-binds that selected
# file to the run.
identity:
  expected_hostname: compute.neural-manifolds.invalid
  expected_user: research.invalid
  ssh_host: ssh.neural-manifolds.invalid
  ssh_port: 22

# Synthetic schema-valid roots. Each root is exactly one direct child of its distinct
# synthetic parent. Replace all six values only in the external server-only config;
# no project directory is inferred from another project.
storage:
  canonical_root: /srv/neural-manifolds.invalid/canonical/project
  work_root: /srv/neural-manifolds.invalid/work/project
  checkpoint_root: /srv/neural-manifolds.invalid/checkpoint/project
  raw_subdirectory: raw
  raw_data_location: canonical_only
  immutable_raw: true
  active_derivatives_location: work_only
  logs_and_markers_location: checkpoint_only
  allowed_parent_mounts:
    canonical: /srv/neural-manifolds.invalid/canonical
    work: /srv/neural-manifolds.invalid/work
    checkpoint: /srv/neural-manifolds.invalid/checkpoint

scheduler:
  # Queue mode template only; validate the real scheduler/tool inventory separately.
  type: tmux
  slurm_available: null
  session_prefix: neural-manifolds
  queue_module: workflow.queue

deployment:
  source_mode: content_addressed
  github_repository: https://github.com/pwa209/Neural-Manifolds.git
  require_exact_commit: true
  require_source_manifest: true
  destructive_sync: false

runtime:
  python: "3.11"
  gpu: validate_accelerator_and_runtime_before_launch
  deterministic_where_supported: true
  model_cache_subdirectory: cache/models
  model_environment_file: cache/models/model_paths.env
  brainlm_checkpoint_stage: fmri_only

# Legacy static fallback for fMRI inputs. The recommended late-bound path is a
# reviewed external YAML/JSON manifest passed with --fmri-input-manifest, which
# lets earlier phases use an immutable run ID while these values remain unresolved.
# Leave all values null when using the external manifest; the queue rejects mixed
# authorities. Either route hashes both assets and the explicit timing convention.
fmri_inputs:
  ukb424_atlas_path: null
  ukb424_coordinates_path: null
  ds006623_timing_index_origin: null
