interpretation:
  - Independent participants are counted once per source; repeated awakenings are not independent people.
  - Leave-one-dataset-out prediction tests method generality; it is not zero-shot transfer of the original frozen model.
  - Cohorts have different report definitions, ages, reference systems, and timing; do not pool this endpoint with strict E/NE.
  - The Rome cohorts are separate participants but one laboratory cluster.
  - Every QC exclusion and unavailable result must be reported; significance is not a deployment gate.
