[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neural-manifolds"
version = "0.1.0"
description = "Reproducible manifold-regime analyses of consciousness across open EEG, MEG, TMS-EEG, fMRI, and disorders-of-consciousness data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Neural Manifolds Study"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "PyYAML>=6.0.1",
  "requests>=2.31",
  "tqdm>=4.66",
  "platformdirs>=4.2",
  "filelock>=3.13",
  "zarr>=3.1,<4",
  "numcodecs>=0.16",
  "joblib>=1.3",
  "networkx>=3.2",
]

[project.optional-dependencies]
eeg = [
  "mne>=1.7",
  "mne-bids>=0.15",
  "autoreject>=0.4.3",
  "pybv>=0.7",
]
foundation = [
  "torch>=2.3",
  "torchvision>=0.18",
  "einops>=0.8",
  "timm>=1.0",
  "huggingface-hub>=0.23",
]
dynamics = [
  "hmmlearn>=0.3.2",
]
figures = [
  "matplotlib>=3.9",
  "Pillow>=10.3",
]
fmri = [
  "nibabel>=5.2",
  "nilearn>=0.10.4",
  "transformers>=4.41,<5",
  "safetensors>=0.4.3",
]
workflow = [
  "datalad>=1.1",
]
bayes = [
  "pymc>=5.15",
  "arviz>=0.18",
]
dev = [
  "hatchling>=1.25",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
all = [
  "neural-manifolds[eeg,foundation,dynamics,figures,fmri,workflow,bayes,dev]",
]

[project.scripts]
neural-manifolds = "neural_manifolds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_manifolds"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:hmmlearn.utils",
  "ignore:Could not find the number of physical cores:UserWarning:joblib.externals.loky.backend.context",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".brainlm-audit", "**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
