name: technical-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test runtime
        run: python -m pip install --disable-pip-version-check -e '.[dev,eeg,dynamics,figures]'
      - name: Static checks
        run: ruff check src tests workflow scripts
      - name: Test suite
        run: pytest -q
